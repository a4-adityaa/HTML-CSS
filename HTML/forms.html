<!-- this is how we create forms  -->

<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
</head>

<body>
    <h2>HTML FORMS</h2>
    <form action="backend.php">
        <label for="name">Name</label>
        <div><input type="text" name="myName" id="name" /></div>
        <br />
        <div>class <input type="text" name="myClass" /></div>
        <br />
        <div>email <input type="email" name="MyEmail" /></div>
        <br />
        <div>Date <input type="date" name="Today's date" id="" /></div>
        <br />
        <div>time <input type="time" name="current time" id="" /></div>
        <br />
        <label for="eligibility">Are you eligible ?</label>
        <div>
            <input type="checkbox" name="eligibility" checked id="eligibility" />
        </div>
        <br />
        <div>
            <b>Gender:</b> Male<input type="Radio" name="MyGender" id="" />
            Female<input type="Radio" name="MyGender" id="" /> Other<input type="Radio" name="MyGender" id="" />
        </div>
        <br />
        <div>
            <strong> Write about yourself: </strong><br />
            <textarea name="enter about yourself" cols="90" rows="9" id=""></textarea>
        </div>
        <br />
        <div>
            <label for="car"><b>Car: </b></label>
            <select name="Mycar" id="car">
                <option value="ind">Indica</option>
                <option value="swf" selected>Swift</option>
                <option value="bmw">BMW</option>
            </select>
        </div>
        <br />
        <div>
            <input type="submit" value="submit now" />
            <input type="reset" value="reset now" />
        </div>
    </form>
</body>

</html>
