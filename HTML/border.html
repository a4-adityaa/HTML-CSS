<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Height Width background</title>
    <style>
    #a{ 
        font-family: cursive;
        background-color: red;
        width: 400px;
        height: 40px;
        
        border: 4px solid #ffc800;
        /* border-style: solid;
        border-width: 4px;
        border-color: green; */
        border-radius: 9px;
    }
    #b{
        font-family: cursive;
        background-color: rgb(253, 84, 191);
        width: 400px;
        height: 40px;

        border-top: 4px solid green;
        border-left: 4px solid rgb(0, 17, 255);
        border-right: 4px solid red;
        border-bottom: 4px solid black;

        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 13px;
        border-top-left-radius: 12px;
        border-top-right-radius: 16px;
    }
    #c{
        font-family: cursive;
        width: 150px;
        height: 40px;
        background-image: url('https://images.all-free-download.com/images/thumbjpg/wild_nature_picture_ladybug_perching_branch_closeup_6930235.jpg');
        background-position: center center;
    }
    </style>
</head>
<body>
    <h3> This is heading</h3>
    <p id="a">This is a paragraph</p>
    <h3> This is heading</h3>
    <p id="b">This is a paragraph</p>
    <h3> This is heading</h3>
    <p id="c">This is a paragraph</p>
</body>
</html>
