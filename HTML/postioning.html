<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: rgb(198, 198, 255);
            height: 3444px;
        }
        /* postion: static(default), absolute, realtaive, fixed, sticky  */
        .box{
           border: 2px solid blue; 
           width: 150px;
           height: 150px;
           margin: 2px;
           display: inline-block;
        }
        #box3{
            /* reative mean: realative to its original position; */
            /* absolute mean: realative to its normal position: ; */
            /* position: absolute; */
            /* fixed: postion of the element relative to the browser window */
            /* position: fixed;
            right: 10px;
            bottom: 10px; */
            /* top: 30px;
            left: 20px; */
            position: sticky;
            top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">    
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>
</body>
</html>
