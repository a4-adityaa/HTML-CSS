<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* element selector  */
        p{
            color: rgb(255, 0, 0);
        }
        /* id selector  */
        #redele{
            color: chartreuse;
        }
        /* class selector  */
        .bluebg{
            background-color: rgb(100, 100, 160);
            color: yellow;
        }
        /* grouping selector  */
        span,footer{
            color: darkorange;
            background-color: bisque;
        }

    </style>
</head>
<body>
    <h1> CSS selectors</h1>
    <p id="redele" class="bluebg">this is first pagargraph</p>
    <p class="bluebg">this is second paragraph</p>
    <p>this is third paragraph</p>
    <p class="bluebg"> i'm aditya kumar</p>

    <span>this is span message</span>

    <footer>this is footer</footer>
</body>
</html>
