<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists</title>
</head>

<body>
    <ul type="circle">
        <li>this is my 1st unordered list</li>
        <ul>
            <li>this is nest unordered</li>
        </ul>
        <li>this is my 2nd unordered list</li>
    </ul>

    <ol type="i">
    <li>this is 1st line</li>
    <ol>
        <li>this is nest ordered</li>
    </ol>
    <li>this is 2nd line</li>
    </ol>
</body>

</html>
